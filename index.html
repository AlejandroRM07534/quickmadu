<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickMadu – Ultimate Party Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { neon: '#39ff14', pink: '#ff007f', blue: '#00f0ff' }
        }
      }
    }
  </script>
  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBnkdxpXmJonY_S_mXxllyK6D5P_P_Dwt0",
      authDomain: "quickmadu-family.firebaseapp.com",
      projectId: "quickmadu-family",
      storageBucket: "quickmadu-family.firebasestorage.app",
      messagingSenderId: "732997553318",
      appId: "1:732997553318:web:1c9d37834f1a0ba421f867"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.firebaseDB = db; // Hacemos accesible globalmente para el juego
  </script>
</head>
<body class="bg-gradient-to-br from-pink-500 via-blue-400 to-neon min-h-screen flex items-center justify-center p-4">

<div class="bg-white/90 w-full max-w-6xl rounded-3xl shadow-2xl p-6 border-4 border-neon">
<h1 class="text-5xl font-extrabold text-center mb-4 animate-pulse text-pink">🎉 QuickMadu Party 🎉</h1>
<p class="text-center mb-4 text-blue font-bold">Todo el mundo juega desde su móvil. 💥</p>

<div class="flex justify-center gap-2 mb-4">
  <button onclick="toggleDarkMode()" class="px-4 py-2 rounded bg-pink text-white animate-bounce">🌙 Modo Neón</button>
</div>

<div id="setup" class="space-y-4">
  <h2 class="font-bold text-xl">👨‍👩‍👧‍👦 Jugadores</h2>
  <input id="playerName" class="border rounded px-4 py-3 w-full" placeholder="Nombre del jugador" />
  <button onclick="addPlayer()" class="bg-neon text-black w-full py-3 rounded">➕ Añadir jugador</button>
  <ul id="playerList"></ul>

  <h3 class="font-bold mt-4">🃏 Editor de temas</h3>
  <input id="newTheme" class="border rounded px-3 py-2 w-full" placeholder="Nuevo tema personalizado" />
  <button onclick="addTheme()" class="bg-pink text-white w-full py-2 rounded">Añadir tema</button>

  <div id="qr" class="flex justify-center mt-4"></div>
  <p class="text-center text-sm text-blue">📱 Escanea el QR para jugar desde tu móvil</p>

  <button onclick="startGame()" class="bg-blue text-white w-full py-3 rounded font-bold animate-pulse">🚀 Empezar partida</button>
</div>

<div id="game" class="hidden">
  <div class="flex justify-between items-center mb-4">
    <h2 id="theme" class="text-2xl font-extrabold"></h2>
    <div id="timer" class="text-2xl font-black bg-pink text-white px-5 py-2 rounded-full animate-bounce">⏱ 15</div>
  </div>
  <div id="letters" class="mb-4 p-4 rounded bg-blue/20"></div>
  <input id="wordInput" class="border rounded px-4 py-3 w-full mb-2" placeholder="Respuesta" />
  <button onclick="submitWord()" class="bg-neon text-black w-full py-3 rounded">Enviar</button>
  <div id="responses" class="mt-4"></div>
</div>

<div id="final" class="hidden text-center">
  <h2 class="text-3xl font-extrabold mb-3 text-pink">🏆 GANADOR</h2>
  <p id="winner" class="text-3xl font-bold mb-4 text-blue"></p>

  <h3 class="font-bold mt-4 text-neon">🥇 Ranking de la noche</h3>
  <ul id="ranking" class="mt-2 text-black font-bold"></ul>

  <div id="penalty" class="mt-6 bg-red-100 text-red-800 p-4 rounded-xl"></div>

  <button onclick="location.reload()" class="mt-6 bg-pink text-white px-6 py-3 rounded animate-bounce">🔁 Jugar otra vez</button>
</div>
</div>

<script>
// ================== CONFIGURACIÓN ==================
const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
let themes = ['Algo que hay en la cocina', 'Un animal', 'Algo que da miedo', 'Algo que te haga reír'];
let players = [];
let responses = [];
let timeLeft = 15;
let timer;
let audioEnabled = false;

// QR dinámico para móviles
new QRCode(document.getElementById('qr'), {
  text: window.location.href,
  width: 180,
  height: 180
});

function toggleDarkMode() { document.body.classList.toggle('dark'); }

function addPlayer() {
  const name = playerName.value.trim();
  if (!name) return;
  players.push({ name, letters: [], score: 0 });
  playerName.value = '';
  renderPlayers();
}

function renderPlayers() { playerList.innerHTML = players.map(p => `<li>• ${p.name}</li>`).join(''); }
function addTheme() { const t = newTheme.value.trim(); if (t) themes.push(t); newTheme.value = ''; }

function startGame() {
  if (players.length < 2) return alert('Mínimo 2 jugadores');
  setup.classList.add('hidden');
  game.classList.remove('hidden');
  dealLetters();
  nextRound();
  saveGameToFirebase();
}

function dealLetters() { players.forEach(p => { p.letters = []; for (let i=0;i<5;i++) p.letters.push(alphabet[Math.floor(Math.random()*alphabet.length)]); }); }

function nextRound() {
  responses = [];
  theme.textContent = '🎯 ' + themes[Math.floor(Math.random()*themes.length)];
  letters.innerHTML = players.map(p => `<strong>${p.name}:</strong> ${p.letters.join(' ')}<br>`).join('');
  responses.innerHTML = '';
  startTimer();
  saveGameToFirebase();
}

function startTimer() {
  clearInterval(timer);
  timeLeft = 15;
  timer = setInterval(() => { timeLeft--; timerEl.textContent='⏱ '+timeLeft; if(timeLeft<=0){clearInterval(timer); applyRound();} },1000);
}

function submitWord() {
  const word = wordInput.value.trim().toUpperCase();
  wordInput.value='';
  if(!word) return;
  const player = players.find(p=>p.letters.some(l=>word.startsWith(l)));
  if(!player) return;
  if(responses.some(r=>r.player===player.name)) return;
  responses.push({player:player.name, word});
  responsesDiv.innerHTML += `<div>${player.name}: ${word}</div>`;
  saveGameToFirebase();
}

function applyRound(){
  responses.forEach(r=>{ const p = players.find(pl=>pl.name===r.player); const letter = p.letters.find(l=>r.word.startsWith(l)); if(!letter) return; p.letters.splice(p.letters.indexOf(letter),1); p.score++;});
  const winnerPlayer = players.find(p=>p.letters.length===0);
  if(winnerPlayer) endGame(); else {dealLetters(); nextRound();}
}

function endGame(){
  game.classList.add('hidden'); final.classList.remove('hidden');
  players.sort((a,b)=>b.score-a.score);
  winner.textContent=players[0].name;
  ranking.innerHTML=players.map((p,i)=>`<li>${i+1}. ${p.name} (${p.score})</li>`).join('');
  penalty.textContent=`🍾 Penalización para ${players[players.length-1].name}: ¡canta, baila o brinda!`;
  confetti({particleCount:300, spread:120});
}

// ================== FIREBASE ==================
function saveGameToFirebase(){
  const gameData = {players, theme: theme.textContent, responses};
  const partidaID = 'default'; // Para una sola partida familiar, o generar ID dinámico
  set(ref(window.firebaseDB,'partidas/'+partidaID),gameData);
}

// Escuchar cambios en tiempo real
const partidaID='default';
onValue(ref(window.firebaseDB,'partidas/'+partidaID),(snapshot)=>{
  const data=snapshot.val();
  if(!data) return;
  players=data.players||players;
  theme.textContent=data.theme||theme.textContent;
  responsesDiv.innerHTML='';
  (data.responses||[]).forEach(r=>responsesDiv.innerHTML+=`<div>${r.player}: ${r.word}</div>`);
  renderPlayers();
});
</script>
</body>
</html>
